<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat en Tiempo Real - Sockets</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #f8fafc;
        }

        #pantalla-login {
            background: #1e293b;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            text-align: center;
            width: 90%;
            max-width: 400px;
            border: 1px solid #334155;
        }

        #pantalla-login h2 { margin-bottom: 0.5rem; color: #38bdf8; }
        #pantalla-login p { margin-bottom: 1.5rem; color: #94a3b8; font-size: 0.95rem; }

        #pantalla-login input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 1rem;
            margin-bottom: 1rem;
            outline: none;
        }

        #pantalla-login input:focus { border-color: #38bdf8; }

        #pantalla-login button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #0284c7;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        #pantalla-login button:hover { background: #0369a1; }

        #contenedor-chat {
            display: none;
            flex-direction: column;
            width: 95%;
            max-width: 650px;
            height: 85vh;
            background: #1e293b;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            border: 1px solid #334155;
        }

        .chat-header {
            background: #0f172a;
            padding: 14px 20px;
            border-bottom: 1px solid #334155;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .chat-header h1 { font-size: 1.2rem; color: #38bdf8; }

        #usuario-actual {
            font-size: 0.85rem;
            background: #334155;
            padding: 4px 10px;
            border-radius: 20px;
            color: #e2e8f0;
        }

        #barra-conectados {
            font-size: 0.8rem;
            color: #94a3b8;
        }

        #mensajes {
            flex: 1;
            list-style: none;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: #162032;
        }

        #mensajes li.burbuja {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 14px;
            line-height: 1.4;
            word-wrap: break-word;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* Avisos de entrada/salida */
        #mensajes li.sistema {
            align-self: center;
            background: rgba(51, 65, 85, 0.6);
            color: #94a3b8;
            font-size: 0.8rem;
            padding: 4px 14px;
            border-radius: 12px;
            font-style: italic;
        }

        .nombre-remitente {
            display: block;
            font-size: 0.78rem;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .hora-mensaje {
            display: block;
            font-size: 0.68rem;
            opacity: 0.7;
            margin-top: 4px;
            text-align: right;
        }

        .propio {
            background: #065f46;
            color: #ecfdf5;
            margin-left: auto;
            border-bottom-right-radius: 2px;
        }

        .propio .nombre-remitente {
            color: #6ee7b7;
            text-align: right;
        }

        .ajeno {
            background: #334155;
            color: #f8fafc;
            margin-right: auto;
            border-bottom-left-radius: 2px;
        }

        #estado-escribiendo {
            height: 22px;
            padding: 2px 20px;
            font-size: 0.8rem;
            color: #38bdf8;
            background-color: #162032;
            font-style: italic;
        }

        .chat-input-area {
            display: flex;
            padding: 15px;
            background: #0f172a;
            gap: 10px;
            border-top: 1px solid #334155;
        }

        #mensaje {
            flex: 1;
            padding: 12px 16px;
            border-radius: 24px;
            border: 1px solid #475569;
            background: #1e293b;
            color: white;
            font-size: 0.95rem;
            outline: none;
        }

        #mensaje:focus { border-color: #38bdf8; }

        .chat-input-area button {
            padding: 12px 22px;
            border: none;
            border-radius: 24px;
            background: #0284c7;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .chat-input-area button:hover { background: #0369a1; }
    </style>
</head>
<body>

    <div id="pantalla-login">
        <h2>Bienvenido al Chat</h2>
        <p>Ingresa tu nombre para unirte a la conversación</p>
        <input type="text" id="input-nombre" placeholder="Tu nombre o apodo..." maxlength="20" autocomplete="off">
        <button onclick="entrarAlChat()">Entrar al Chat</button>
    </div>

    <div id="contenedor-chat">
        <div class="chat-header">
            <div class="header-top">
                <h1>Chat en tiempo real</h1>
                <span id="usuario-actual"></span>
            </div>
            <div id="barra-conectados">Conectados: cargando...</div>
        </div>

        <ul id="mensajes"></ul>
        <div id="estado-escribiendo"></div>

        <div class="chat-input-area">
            <input type="text" id="mensaje" placeholder="Escribe un mensaje..." autocomplete="off">
            <button onclick="enviarMensaje()">Enviar</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let miNombre = "";
        let temporizadorEscribiendo;

        const paletaColores = [
            "#f472b6", "#fb923c", "#facc15", "#a78bfa", 
            "#38bdf8", "#4ade80", "#f87171", "#2dd4bf"
        ];

        function obtenerColorUsuario(id) {
            let suma = 0;
            for (let i = 0; i < id.length; i++) {
                suma += id.charCodeAt(i);
            }
            return paletaColores[suma % paletaColores.length];
        }

        function entrarAlChat() {
            const inputNombre = document.getElementById("input-nombre");
            const nombreIngresado = inputNombre.value.trim();

            if (nombreIngresado === "") {
                alert("Por favor, escribe tu nombre antes de entrar.");
                return;
            }

            miNombre = nombreIngresado;
            document.getElementById("usuario-actual").textContent = `Tú: ${miNombre}`;
            document.getElementById("pantalla-login").style.display = "none";
            document.getElementById("contenedor-chat").style.display = "flex";
            document.getElementById("mensaje").focus();

            // Notificar al servidor el nombre del nuevo usuario
            socket.emit("nuevo-usuario", miNombre);
        }

        document.getElementById("input-nombre").addEventListener("keypress", (e) => {
            if (e.key === "Enter") entrarAlChat();
        });

        // Detectar cuando el usuario escribe para avisar a los demás
        document.getElementById("mensaje").addEventListener("input", () => {
            socket.emit("escribiendo", miNombre);
            clearTimeout(temporizadorEscribiendo);
            temporizadorEscribiendo = setTimeout(() => {
                socket.emit("dejo-de-escribir");
            }, 1200);
        });

        function enviarMensaje() {
            const input = document.getElementById("mensaje");
            const texto = input.value.trim();

            if (texto !== "") {
                socket.emit("mensaje", {
                    nombre: miNombre,
                    texto: texto
                });
                socket.emit("dejo-de-escribir");
                input.value = "";
                input.focus();
            }
        }

        document.getElementById("mensaje").addEventListener("keypress", (e) => {
            if (e.key === "Enter") enviarMensaje();
        });

        // Actualizar lista de usuarios en línea
        socket.on("lista-usuarios", (usuarios) => {
            const barra = document.getElementById("barra-conectados");
            barra.textContent = `En línea (${usuarios.length}): ${usuarios.join(", ")}`;
        });

        // Mostrar avisos cuando alguien entra o sale
        socket.on("sistema", (textoAviso) => {
            const lista = document.getElementById("mensajes");
            const item = document.createElement("li");
            item.classList.add("sistema");
            item.textContent = textoAviso;
            lista.appendChild(item);
            lista.scrollTop = lista.scrollHeight;
        });

        // Mostrar quién está escribiendo
        socket.on("escribiendo", (nombre) => {
            document.getElementById("estado-escribiendo").textContent = `${nombre} está escribiendo...`;
        });

        socket.on("dejo-de-escribir", () => {
            document.getElementById("estado-escribiendo").textContent = "";
        });

        // Recibir mensajes de todos
        socket.on("mensaje", ({ id, nombre, texto, hora }) => {
            const lista = document.getElementById("mensajes");
            const item = document.createElement("li");
            const esMio = id === socket.id;

            item.classList.add("burbuja", esMio ? "propio" : "ajeno");

            const etiquetaNombre = document.createElement("span");
            etiquetaNombre.classList.add("nombre-remitente");
            etiquetaNombre.textContent = esMio ? `${nombre} (Tú)` : nombre;

            if (!esMio) {
                const colorUsuario = obtenerColorUsuario(id);
                etiquetaNombre.style.color = colorUsuario;
                item.style.borderLeft = `4px solid ${colorUsuario}`;
            }

            const contenidoTexto = document.createElement("span");
            contenidoTexto.textContent = texto;

            const etiquetaHora = document.createElement("span");
            etiquetaHora.classList.add("hora-mensaje");
            etiquetaHora.textContent = hora || "";

            item.appendChild(etiquetaNombre);
            item.appendChild(contenidoTexto);
            item.appendChild(etiquetaHora);
            lista.appendChild(item);

            lista.scrollTop = lista.scrollHeight;
        });
    </script>
</body>
</html>
